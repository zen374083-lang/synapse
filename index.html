<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Dark | Полноэкранный ИИ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #000000;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(180deg, #0d1527 0%, #000000 100%);
            scrollbar-width: none; 
        }

        .screen::-webkit-scrollbar {
            display: none; 
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble.user {
            background-color: #2563eb; 
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .bubble.ai {
            background-color: #1e293b;
            border: 1px solid #2e3e56;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-bar {
            padding: 20px 24px;
            background-color: #060913;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            padding: 16px 20px;
            background-color: #0d1527;
            border: 1px solid #1e293b;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-bar input:focus {
            border-color: #2563eb;
        }

        .input-bar button {
            padding: 0 32px;
            height: 54px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-bar button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="screen" id="chatScreen">
        <div class="bubble ai">🤖 Полноэкранный терминал Synapse Dark успешно развернут!

Все systems работают стабильно. Твои сообщения синие, интерфейс чистый. Задержка ответа настроена ровно на 1 секунду. Напиши мне «привет», «хорошо», «дела», «код» или «шутка»! 🤜🤛</div>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off">
        <button type="button" onclick="sendToAI()">ОТПРАВИТЬ</button>
    </div>

<script>
    window.onload = function() {
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { sendToAI(); }
        });
        document.getElementById('userInput').focus();
    };

    function sendToAI() {
        var inputField = document.getElementById('userInput');
        var query = inputField.value.trim();
        if (!query) return;

        printMessage(query, 'user');
        inputField.value = '';

        setTimeout(function() {
            var reply = getReply(query);
            printMessage(reply, 'ai');
        }, 1000); 
    }

    function getReply(rawText) {
        var text = rawText.toLowerCase();

        if (text.indexOf("привет") !== -1 || text.indexOf("ку") !== -1 || text.indexOf("хай") !== -1) {
            return "Привет-привет! Рад тебя видеть в полноэкранном терминале Synapse Dark. О чём поболтаем? 🤜🤛";
        }
        if (text.indexOf("хорошо") !== -1 || text.indexOf("круто") !== -1 || text.indexOf("супер") !== -1) {
            return "Рад слышать! Когда у тебя всё отлично, я готов работать на полную мощность! Что дальше по плану? 🚀";
        }
        if (text.indexOf("ок") !== -1 || text.indexOf("ладно") !== -1 || text.indexOf("понял") !== -1) {
            return "Договорились! 👍 Пиши свой следующий вопрос, я готов.";
        }
        if (text.indexOf("спасибо") !== -1 || text.indexOf("спс") !== -1) {
            return "Всегда пожалуйста! Мы же отличная команда. 😉";
        }
        if (text.indexOf("дела") !== -1 || text.indexOf("как ты") !== -1) {
            return "Мои системы в норме, процессор холодный! Как твои дела, как день проходит?";
        }
        if (text.indexOf("код") !== -1 || text.indexOf("html") !== -1) {
            return "Вот каркас страницы:\n<h1>Привет от Synapse Dark!</h1>";
        }
        if (text.indexOf("шутка") !== -1 || text.indexOf("пошути") !== -1) {
            return "Почему программисты любят темную тему? Потому что свет привлекает багов! 🪲";
        }

        return "💡 Я принял твой запрос: \"" + rawText + "\". Я отлично понимаю слова: привет, хорошо, ок, спасибо, дела, код, шутка!";
    }

    function printMessage(text, sender) {
        var screen = document.getElementById('chatScreen');
        var bubble = document.createElement('div');
        bubble.className = "bubble " + sender;
        bubble.textContent = text;
        screen.appendChild(bubble);
        screen.scrollTop = screen.scrollHeight;
    }
</script>

</body>
</html>
